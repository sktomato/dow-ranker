[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dow-ranker"
version = "0.1.0"
description = "Rank Dow Jones stocks by predicted next-week relative return, with honest intervals and input checks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Samson Koudelka" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "altair>=5"]
dev = ["pytest>=8"]

[project.scripts]
dow-ranker = "dow_ranker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dow_ranker.models" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
